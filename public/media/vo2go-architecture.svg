<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b82f6"/>
    </marker>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#374151"/><stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="og" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif}</style>

  <rect width="1400" height="650" fill="#fff"/>

  <!-- Section headers -->
  <text x="190" y="38" text-anchor="middle" font-size="12" font-weight="700" fill="#3b82f6" letter-spacing="2.5">INPUT</text>
  <text x="190" y="55" text-anchor="middle" font-size="10" fill="#94a3b8">Wearable + Demographics</text>
  <text x="680" y="38" text-anchor="middle" font-size="12" font-weight="700" fill="#3b82f6" letter-spacing="2.5">MODEL</text>
  <text x="680" y="55" text-anchor="middle" font-size="10" fill="#94a3b8">LSTM Neural Network</text>
  <text x="1150" y="38" text-anchor="middle" font-size="12" font-weight="700" fill="#3b82f6" letter-spacing="2.5">OUTPUT</text>
  <text x="1150" y="55" text-anchor="middle" font-size="10" fill="#94a3b8">Threshold Prediction</text>

  <!-- ===== APPLE WATCH ===== -->
  <g transform="translate(110,195)">
    <!-- Bands -->
    <rect x="38" y="-48" width="64" height="56" rx="6" fill="#e2e8f0"/>
    <rect x="52" y="-50" width="36" height="8" rx="3" fill="#cbd5e1"/>
    <rect x="38" y="200" width="64" height="56" rx="6" fill="#e2e8f0"/>
    <rect x="52" y="248" width="36" height="8" rx="3" fill="#cbd5e1"/>
    <!-- Body -->
    <rect x="5" y="0" width="130" height="200" rx="38" fill="url(#wg)" stroke="#4b5563" stroke-width="0.8"/>
    <!-- Crown & button -->
    <rect x="131" y="48" width="10" height="28" rx="4.5" fill="#6b7280" stroke="#9ca3af" stroke-width="0.4"/>
    <rect x="132" y="92" width="8" height="15" rx="3.5" fill="#6b7280" stroke="#9ca3af" stroke-width="0.4"/>
    <!-- Screen -->
    <rect x="16" y="14" width="108" height="172" rx="28" fill="#0f172a"/>
    <!-- Time -->
    <text x="70" y="50" text-anchor="middle" font-size="22" font-weight="300" fill="#f1f5f9" letter-spacing="1">10:10</text>
    <line x1="28" y1="58" x2="112" y2="58" stroke="#1e293b" stroke-width="0.5"/>
    <!-- Heart + BPM -->
    <path d="M62 70c0-3.5 3.5-5 5.5-2s5.5-1.5 5.5 2c0 5-5.5 9.5-5.5 9.5S62 75 62 70z" fill="#ef4444"/>
    <text x="88" y="80" font-size="11" font-weight="700" fill="#ef4444">142</text>
    <text x="70" y="100" text-anchor="middle" font-size="8" fill="#94a3b8" letter-spacing="1.5">BPM</text>
    <!-- HR waveform -->
    <polyline points="24,120 30,120 33,113 37,128 41,108 45,125 49,116 53,120 59,120 63,112 67,127 71,114 75,123 79,116 83,120 89,120 93,111 97,126 101,120 107,120" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <!-- Activity rings -->
    <circle cx="50" cy="155" r="14" stroke="#ef4444" stroke-width="2.5" fill="none" opacity="0.5" stroke-dasharray="55 35"/>
    <circle cx="50" cy="155" r="10" stroke="#22c55e" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="40 30"/>
    <circle cx="50" cy="155" r="6" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.5"/>
    <!-- Complication text -->
    <text x="90" y="148" font-size="7" fill="#94a3b8">MON 17</text>
    <text x="90" y="162" font-size="7" fill="#94a3b8">72&#xb0;F</text>
  </g>

  <!-- ===== FEATURE CIRCLES ===== -->

  <!-- 1 Heart Rate — top -->
  <g>
    <line x1="230" y1="260" x2="305" y2="148" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="4 3"/>
    <circle cx="330" cy="130" r="26" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <path d="M323 127c0-3 3-4.5 5-2s5-1 5 2c0 4-5 7.5-5 7.5S323 131 323 127z" fill="#ef4444" transform="translate(2,0)"/>
    <text x="330" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Heart Rate</text>
    <text x="330" y="186" text-anchor="middle" font-size="9" fill="#94a3b8">time series</text>
  </g>

  <!-- 2 Age — upper right -->
  <g>
    <line x1="240" y1="310" x2="320" y2="262" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4 3"/>
    <circle cx="345" cy="250" r="26" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="345" cy="247" r="9" stroke="#3b82f6" stroke-width="1.4" fill="none"/>
    <line x1="345" y1="247" x2="345" y2="241" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="345" y1="247" x2="349" y2="249" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round"/>
    <text x="345" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Age</text>
    <text x="345" y="306" text-anchor="middle" font-size="9" fill="#94a3b8">years</text>
  </g>

  <!-- 3 Weight — right -->
  <g>
    <line x1="240" y1="365" x2="330" y2="370" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4 3"/>
    <circle cx="355" cy="370" r="26" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <polygon points="345,376 355,360 365,376" stroke="#3b82f6" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
    <line x1="341" y1="378" x2="369" y2="378" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round"/>
    <text x="355" y="412" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Weight</text>
    <text x="355" y="426" text-anchor="middle" font-size="9" fill="#94a3b8">kg</text>
  </g>

  <!-- 4 Height — lower right -->
  <g>
    <line x1="240" y1="400" x2="318" y2="480" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4 3"/>
    <circle cx="345" cy="485" r="26" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <line x1="345" y1="473" x2="345" y2="497" stroke="#3b82f6" stroke-width="1.4"/>
    <polyline points="340,478 345,473 350,478" stroke="#3b82f6" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="340,492 345,497 350,492" stroke="#3b82f6" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="345" y="527" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Height</text>
    <text x="345" y="541" text-anchor="middle" font-size="9" fill="#94a3b8">cm</text>
  </g>

  <!-- 5 Sex — bottom -->
  <g>
    <line x1="185" y1="420" x2="210" y2="550" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4 3"/>
    <circle cx="230" cy="570" r="26" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="230" cy="562" r="5.5" stroke="#3b82f6" stroke-width="1.4" fill="none"/>
    <line x1="230" y1="568" x2="230" y2="582" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="222" y1="574" x2="238" y2="574" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round"/>
    <text x="230" y="612" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Sex</text>
    <text x="230" y="626" text-anchor="middle" font-size="9" fill="#94a3b8">M / F</text>
  </g>

  <!-- ===== ARROWS: features → model ===== -->
  <!-- HR → LSTM -->
  <path d="M356 130 C420 130, 470 180, 530 190" stroke="#ef4444" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="430" y="145" font-size="8" fill="#ef4444" font-weight="500">HR sequence</text>
  <!-- Demographics → Concat -->
  <path d="M371 250 C420 250, 475 275, 530 280" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M381 370 C430 370, 480 340, 530 330" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M371 485 C430 485, 480 400, 530 380" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M256 570 C360 570, 470 440, 530 410" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <!-- Bracket label -->
  <text x="460" y="385" font-size="8" fill="#64748b" font-weight="500">demographics</text>

  <!-- ===== MODEL BLOCK ===== -->
  <g>
    <!-- Card -->
    <rect x="530" y="85" width="300" height="480" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <!-- Header -->
    <rect x="530" y="85" width="300" height="48" rx="16" fill="url(#mg)"/>
    <rect x="530" y="110" width="300" height="23" fill="url(#mg)"/>
    <text x="680" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" letter-spacing="0.5">LSTM Neural Network</text>

    <!-- LSTM layer -->
    <rect x="568" y="155" width="224" height="62" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="680" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">LSTM Layer</text>
    <text x="680" y="200" text-anchor="middle" font-size="10" fill="#3b82f6">64 hidden units · 1 layer</text>

    <!-- Down arrow -->
    <line x1="680" y1="217" x2="680" y2="242" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Concatenate -->
    <rect x="600" y="248" width="160" height="48" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
    <text x="680" y="270" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Concatenate</text>
    <text x="680" y="286" text-anchor="middle" font-size="8.5" fill="#a16207">LSTM output + 4 static features</text>

    <!-- Down arrow -->
    <line x1="680" y1="296" x2="680" y2="322" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Dense + ReLU -->
    <rect x="568" y="328" width="224" height="55" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="680" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Dense + ReLU</text>
    <text x="680" y="372" text-anchor="middle" font-size="10" fill="#3b82f6">64 neurons</text>

    <!-- Down arrow -->
    <line x1="680" y1="383" x2="680" y2="408" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Output layer -->
    <rect x="600" y="414" width="160" height="50" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="680" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Regression Output</text>
    <text x="680" y="456" text-anchor="middle" font-size="10" fill="#15803d">1 node → VT1</text>

    <!-- MSE label -->
    <text x="680" y="492" text-anchor="middle" font-size="9" fill="#94a3b8">Loss: Mean Squared Error</text>
    <text x="680" y="506" text-anchor="middle" font-size="9" fill="#94a3b8">Split: 70 / 15 / 15</text>
    <text x="680" y="520" text-anchor="middle" font-size="9" fill="#94a3b8">868 exercise tests · 20 epochs</text>
  </g>

  <!-- ===== ARROW: model → output ===== -->
  <line x1="830" y1="325" x2="935" y2="325" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-b)"/>

  <!-- ===== OUTPUT CARD ===== -->
  <g>
    <rect x="940" y="85" width="410" height="480" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <!-- Header -->
    <rect x="940" y="85" width="410" height="48" rx="16" fill="url(#og)"/>
    <rect x="940" y="110" width="410" height="23" fill="url(#og)"/>
    <text x="1145" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" letter-spacing="0.5">Your Results</text>

    <!-- VT1 Big Display -->
    <text x="1145" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b" letter-spacing="2">VENTILATORY THRESHOLD</text>
    <text x="1145" y="222" text-anchor="middle" font-size="52" font-weight="800" fill="#1e293b">VT1</text>
    <text x="1145" y="262" text-anchor="middle" font-size="30" font-weight="700" fill="#059669">1,914</text>
    <text x="1145" y="284" text-anchor="middle" font-size="12" fill="#64748b">mL/min VO&#x2082;</text>

    <!-- Divider -->
    <line x1="975" y1="305" x2="1315" y2="305" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Training Zones label -->
    <text x="1145" y="330" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b" letter-spacing="2">TRAINING ZONES</text>

    <!-- Zone bars -->
    <!-- Z1 Recovery -->
    <rect x="975" y="345" width="300" height="26" rx="5" fill="#e0f2fe"/>
    <rect x="975" y="345" width="60" height="26" rx="5" fill="#38bdf8"/>
    <text x="986" y="363" font-size="9" font-weight="700" fill="#fff">Z1</text>
    <text x="1046" y="363" font-size="9" fill="#0284c7">Recovery</text>

    <!-- Z2 Aerobic -->
    <rect x="975" y="378" width="300" height="26" rx="5" fill="#dcfce7"/>
    <rect x="975" y="378" width="120" height="26" rx="5" fill="#22c55e"/>
    <text x="986" y="396" font-size="9" font-weight="700" fill="#fff">Z2</text>
    <text x="1102" y="396" font-size="9" fill="#15803d">Aerobic</text>

    <!-- Z3 Tempo -->
    <rect x="975" y="411" width="300" height="26" rx="5" fill="#fef9c3"/>
    <rect x="975" y="411" width="180" height="26" rx="5" fill="#eab308"/>
    <text x="986" y="429" font-size="9" font-weight="700" fill="#fff">Z3</text>
    <text x="1162" y="429" font-size="9" fill="#a16207">Tempo</text>

    <!-- Z4 Threshold -->
    <rect x="975" y="444" width="300" height="26" rx="5" fill="#ffedd5"/>
    <rect x="975" y="444" width="240" height="26" rx="5" fill="#f97316"/>
    <text x="986" y="462" font-size="9" font-weight="700" fill="#fff">Z4</text>
    <text x="1222" y="462" font-size="9" fill="#c2410c">Threshold</text>

    <!-- Z5 VO2 Max -->
    <rect x="975" y="477" width="300" height="26" rx="5" fill="#fee2e2"/>
    <rect x="975" y="477" width="300" height="26" rx="5" fill="#ef4444"/>
    <text x="986" y="495" font-size="9" font-weight="700" fill="#fff">Z5</text>
    <text x="1120" y="495" font-size="9" font-weight="600" fill="#fff">VO&#x2082; Max</text>

    <!-- VT1 marker line -->
    <line x1="1095" y1="340" x2="1095" y2="508" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="1074" y="512" width="42" height="18" rx="4" fill="#dc2626"/>
    <text x="1095" y="525" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">VT1</text>

    <!-- Bottom annotation -->
    <rect x="1020" y="540" width="250" height="22" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
    <text x="1145" y="556" text-anchor="middle" font-size="9.5" font-weight="600" fill="#059669">Aerobic threshold detected from HR alone</text>
  </g>
</svg>
