<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="UMN Small Satellite Research Laboratory">
  <!-- Square mark rather than the full horizontal lockup: the wordmark is
       unreadable at the sizes this renders at, the satellite is not. -->
  <rect width="400" height="400" fill="#ffffff"/>
  <g transform="rotate(-22 200 180)">
    <g fill="#111111">
      <rect x="152" y="120" width="96" height="120"/>
      <rect x="44" y="142" width="46" height="76"/>
      <rect x="96" y="142" width="46" height="76"/>
      <rect x="258" y="142" width="46" height="76"/>
      <rect x="310" y="142" width="46" height="76"/>
    </g>
    <g fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="34" text-anchor="middle">
      <text x="200" y="160">U</text>
      <text x="200" y="196">M</text>
      <text x="200" y="232">N</text>
    </g>
  </g>
  <path d="M24 330 Q200 268 376 322" fill="none" stroke="#7a0019" stroke-width="13" stroke-linecap="round"/>
</svg>
