<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="IEEE at the University of Minnesota">
  <!-- Gold top band with UMN block M -->
  <rect width="400" height="200" fill="#ffcc33"/>
  <!-- Maroon bottom band with IEEE -->
  <rect y="200" width="400" height="200" fill="#7a0019"/>
  <!-- Block M — thicker strokes, centered -->
  <path fill="#7a0019" d="M88 170V42h40l72 72 72-72h40v128h-40V90l-56 56h-32L128 90v80z"/>
  <!-- Registered mark -->
  <text x="314" y="170" font-family="Arial, sans-serif" font-size="18" fill="#7a0019">®</text>
  <!-- IEEE diamond mark -->
  <g transform="translate(68, 300)">
    <path fill="#fff" d="M32 -32 64 0 32 32 0 0z"/>
    <path fill="#7a0019" d="M32 -20 52 0 32 20 12 0z"/>
    <!-- Compass/lightning in diamond -->
    <line x1="32" y1="-14" x2="32" y2="14" stroke="#fff" stroke-width="2.5"/>
    <line x1="22" y1="0" x2="42" y2="0" stroke="#fff" stroke-width="2.5"/>
    <circle cx="32" cy="0" r="6" fill="none" stroke="#fff" stroke-width="1.5"/>
  </g>
  <!-- IEEE text -->
  <text x="160" y="312" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="72" fill="#fff" textLength="160" lengthAdjust="spacingAndGlyphs">IEEE</text>
  <!-- Tagline -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#fff" text-anchor="middle">
    <text x="200" y="352" font-size="28" textLength="260" lengthAdjust="spacingAndGlyphs">Advancing Technology</text>
    <text x="200" y="384" font-size="28" textLength="162" lengthAdjust="spacingAndGlyphs">for Humanity</text>
  </g>
</svg>
