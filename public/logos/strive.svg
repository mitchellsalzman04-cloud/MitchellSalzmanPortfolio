<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="STRIVE Medical">
  <!-- textLength pins each line's width, so the lockup keeps its proportions
       even where the exact face isn't installed and a fallback steps in. -->
  <rect width="400" height="400" fill="#ffffff"/>
  <g fill="#3a3d42" font-family="Arial, Helvetica, sans-serif" font-weight="500">
    <text x="30" y="168" font-size="150" textLength="342" lengthAdjust="spacingAndGlyphs">STR</text>
    <text x="30" y="300" font-size="150" textLength="342" lengthAdjust="spacingAndGlyphs">IVE</text>
    <text x="372" y="382" font-size="76" font-weight="400" text-anchor="end" textLength="246" lengthAdjust="spacingAndGlyphs">Medical</text>
  </g>
</svg>
