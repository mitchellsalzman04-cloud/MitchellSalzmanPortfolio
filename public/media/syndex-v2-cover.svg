<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0efe8"/>
      <stop offset="100%" stop-color="#e8e7e0"/>
    </linearGradient>
    <linearGradient id="alum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8c8c0"/>
      <stop offset="30%" stop-color="#e0e0d8"/>
      <stop offset="50%" stop-color="#d5d5cd"/>
      <stop offset="70%" stop-color="#e8e8e0"/>
      <stop offset="100%" stop-color="#c0c0b8"/>
    </linearGradient>
    <linearGradient id="alumV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0d0c8"/>
      <stop offset="30%" stop-color="#e5e5dd"/>
      <stop offset="70%" stop-color="#d8d8d0"/>
      <stop offset="100%" stop-color="#c5c5bd"/>
    </linearGradient>
    <linearGradient id="motor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a38"/>
      <stop offset="50%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#bg)"/>
  <ellipse cx="380" cy="500" rx="260" ry="22" fill="url(#shadow)"/>

  <!-- AXIS 1: Base X-rail (horizontal, along the bottom) -->
  <g>
    <!-- Rail body -->
    <rect x="100" y="360" width="380" height="30" rx="2" fill="url(#alum)" stroke="#b0b0a8" stroke-width="0.5"/>
    <line x1="100" y1="368" x2="480" y2="368" stroke="#bbbbb3" stroke-width="0.4"/>
    <line x1="100" y1="382" x2="480" y2="382" stroke="#bbbbb3" stroke-width="0.4"/>
    <line x1="100" y1="372" x2="480" y2="372" stroke="#d5d5cd" stroke-width="0.3"/>
    <line x1="100" y1="378" x2="480" y2="378" stroke="#d5d5cd" stroke-width="0.3"/>
    <!-- Motor at left end -->
    <rect x="52" y="350" width="48" height="50" rx="2" fill="url(#motor)" stroke="#333" stroke-width="0.5"/>
    <rect x="52" y="346" width="48" height="4" rx="1" fill="#444"/>
    <rect x="52" y="400" width="48" height="4" rx="1" fill="#444"/>
    <circle cx="76" cy="375" r="8" fill="none" stroke="#555" stroke-width="0.5"/>
    <circle cx="76" cy="375" r="3" fill="#666"/>
    <!-- Bolts -->
    <circle cx="62" cy="358" r="3" fill="#333" stroke="#555" stroke-width="0.3"/>
    <circle cx="90" cy="358" r="3" fill="#333" stroke="#555" stroke-width="0.3"/>
    <circle cx="62" cy="392" r="3" fill="#333" stroke="#555" stroke-width="0.3"/>
    <circle cx="90" cy="392" r="3" fill="#333" stroke="#555" stroke-width="0.3"/>
    <!-- Carriage block riding on rail -->
    <rect x="280" y="348" width="55" height="54" rx="2" fill="#555" stroke="#444" stroke-width="0.5"/>
    <rect x="285" y="353" width="45" height="44" rx="1" fill="#606060"/>
    <circle cx="300" cy="365" r="3.5" fill="#444"/>
    <circle cx="322" cy="365" r="3.5" fill="#444"/>
    <circle cx="300" cy="385" r="3.5" fill="#444"/>
    <circle cx="322" cy="385" r="3.5" fill="#444"/>
  </g>

  <!-- Mounting plate between X carriage and Z rail -->
  <rect x="278" y="340" width="60" height="8" rx="1" fill="#555" stroke="#444" stroke-width="0.5"/>

  <!-- AXIS 2: Z-rail (going into scene at angle, mounted on X carriage) -->
  <g transform="translate(308, 335) rotate(-52)">
    <!-- Rail body -->
    <rect x="0" y="-15" width="310" height="30" rx="2" fill="url(#alum)" stroke="#b0b0a8" stroke-width="0.5"/>
    <line x1="0" y1="-8" x2="310" y2="-8" stroke="#bbbbb3" stroke-width="0.4"/>
    <line x1="0" y1="8" x2="310" y2="8" stroke="#bbbbb3" stroke-width="0.4"/>
    <line x1="0" y1="-3" x2="310" y2="-3" stroke="#d5d5cd" stroke-width="0.3"/>
    <line x1="0" y1="3" x2="310" y2="3" stroke="#d5d5cd" stroke-width="0.3"/>
    <!-- Motor at far end -->
    <rect x="312" y="-25" width="48" height="50" rx="2" fill="url(#motor)" stroke="#333" stroke-width="0.5"/>
    <rect x="312" y="-29" width="48" height="4" rx="1" fill="#444"/>
    <rect x="312" y="25" width="48" height="4" rx="1" fill="#444"/>
    <circle cx="336" cy="0" r="8" fill="none" stroke="#555" stroke-width="0.5"/>
    <circle cx="336" cy="0" r="3" fill="#666"/>
    <circle cx="322" cy="-18" r="3" fill="#333" stroke="#555" stroke-width="0.3"/>
    <circle cx="350" cy="-18" r="3" fill="#333" stroke="#555" stroke-width="0.3"/>
    <circle cx="322" cy="18" r="3" fill="#333" stroke="#555" stroke-width="0.3"/>
    <circle cx="350" cy="18" r="3" fill="#333" stroke="#555" stroke-width="0.3"/>
    <!-- Carriage block -->
    <rect x="100" y="-22" width="55" height="44" rx="2" fill="#555" stroke="#444" stroke-width="0.5"/>
    <rect x="105" y="-18" width="45" height="36" rx="1" fill="#606060"/>
    <circle cx="120" cy="-8" r="3.5" fill="#444"/>
    <circle cx="140" cy="-8" r="3.5" fill="#444"/>
    <circle cx="120" cy="8" r="3.5" fill="#444"/>
    <circle cx="140" cy="8" r="3.5" fill="#444"/>
  </g>

  <!-- AXIS 3: Y-rail (vertical, mounted on Z carriage) -->
  <g>
    <!-- Mounting plate from Z carriage -->
    <rect x="362" y="222" width="8" height="50" rx="1" fill="#555" stroke="#444" stroke-width="0.5"/>
    <!-- Rail body (vertical) -->
    <rect x="370" y="80" width="30" height="250" rx="2" fill="url(#alumV)" stroke="#b0b0a8" stroke-width="0.5"/>
    <line x1="378" y1="80" x2="378" y2="330" stroke="#bbbbb3" stroke-width="0.4"/>
    <line x1="392" y1="80" x2="392" y2="330" stroke="#bbbbb3" stroke-width="0.4"/>
    <line x1="383" y1="80" x2="383" y2="330" stroke="#d5d5cd" stroke-width="0.3"/>
    <line x1="387" y1="80" x2="387" y2="330" stroke="#d5d5cd" stroke-width="0.3"/>
    <!-- Motor at top -->
    <rect x="360" y="30" width="50" height="50" rx="2" fill="url(#motor)" stroke="#333" stroke-width="0.5"/>
    <rect x="356" y="30" width="4" height="50" rx="1" fill="#444"/>
    <rect x="410" y="30" width="4" height="50" rx="1" fill="#444"/>
    <circle cx="385" cy="55" r="8" fill="none" stroke="#555" stroke-width="0.5"/>
    <circle cx="385" cy="55" r="3" fill="#666"/>
    <circle cx="370" cy="40" r="3" fill="#333" stroke="#555" stroke-width="0.3"/>
    <circle cx="400" cy="40" r="3" fill="#333" stroke="#555" stroke-width="0.3"/>
    <circle cx="370" cy="70" r="3" fill="#333" stroke="#555" stroke-width="0.3"/>
    <circle cx="400" cy="70" r="3" fill="#333" stroke="#555" stroke-width="0.3"/>
    <!-- Carriage block riding vertically -->
    <rect x="358" y="275" width="54" height="50" rx="2" fill="#555" stroke="#444" stroke-width="0.5"/>
    <rect x="363" y="280" width="44" height="40" rx="1" fill="#606060"/>
    <circle cx="378" cy="293" r="3.5" fill="#444"/>
    <circle cx="398" cy="293" r="3.5" fill="#444"/>
    <circle cx="378" cy="310" r="3.5" fill="#444"/>
    <circle cx="398" cy="310" r="3.5" fill="#444"/>
  </g>

  <!-- Ball-and-socket joint + arm from Y carriage -->
  <g>
    <!-- Arm extending from carriage -->
    <line x1="412" y1="300" x2="445" y2="300" stroke="#888" stroke-width="3"/>
    <!-- Ball -->
    <circle cx="450" cy="300" r="10" fill="#bbb" stroke="#999" stroke-width="1"/>
    <circle cx="450" cy="300" r="6" fill="#ddd"/>
    <!-- Ring -->
    <ellipse cx="450" cy="300" rx="10" ry="3" fill="none" stroke="#aaa" stroke-width="0.8"/>
    <!-- Stem -->
    <line x1="450" y1="310" x2="450" y2="330" stroke="#888" stroke-width="2.5"/>
    <!-- Pistol grip -->
    <rect x="440" y="330" width="20" height="50" rx="4" fill="#222" stroke="#444" stroke-width="0.5"/>
    <!-- Handle angled -->
    <rect x="438" y="360" width="16" height="55" rx="3" fill="#1a1a1a" stroke="#333" stroke-width="0.5" transform="rotate(18, 446, 388)"/>
    <!-- Bottom of handle -->
    <rect x="436" y="408" width="18" height="8" rx="3" fill="#1a1a1a" transform="rotate(18, 446, 412)"/>
    <!-- Trigger guard -->
    <path d="M444,365 Q444,388 450,388 Q456,388 456,365" fill="none" stroke="#555" stroke-width="1.5"/>
    <!-- Trigger -->
    <rect x="448" y="368" width="4" height="14" rx="1" fill="#666" transform="rotate(10, 450, 375)"/>
  </g>

  <!-- Axis labels -->
  <g fill="#888" font-size="11" font-family="sans-serif" opacity="0.45">
    <text x="180" y="430">X axis</text>
    <text x="540" y="165" transform="rotate(-52, 540, 165)">Z axis</text>
    <text x="418" y="190">Y axis</text>
  </g>
</svg>
