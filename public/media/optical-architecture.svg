<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b82f6"/>
    </marker>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="og" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="tissue-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fecdd3"/><stop offset="50%" stop-color="#e8a0a0"/><stop offset="100%" stop-color="#d4908f"/>
    </linearGradient>
    <linearGradient id="probe-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.7"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tc">
      <rect x="30" y="70" width="220" height="340" rx="18"/>
    </clipPath>
  </defs>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif}</style>

  <rect width="1200" height="520" fill="#fff"/>

  <!-- ===== TISSUE + PROBE (left) ===== -->
  <g>
    <!-- Tissue block -->
    <rect x="30" y="70" width="220" height="340" rx="18" fill="url(#tissue-g)" stroke="#d4a0a0" stroke-width="2"/>

    <!-- Subtle cells -->
    <g clip-path="url(#tc)" opacity="0.25">
      <circle cx="80" cy="140" r="22" fill="none" stroke="#b07070" stroke-width="1.5"/>
      <circle cx="80" cy="140" r="6" fill="#b07070" opacity="0.4"/>
      <circle cx="145" cy="170" r="18" fill="none" stroke="#b07070" stroke-width="1.5"/>
      <circle cx="145" cy="170" r="5" fill="#b07070" opacity="0.4"/>
      <circle cx="100" cy="220" r="20" fill="none" stroke="#b07070" stroke-width="1.5"/>
      <circle cx="100" cy="220" r="6" fill="#b07070" opacity="0.4"/>
      <circle cx="60" cy="310" r="17" fill="none" stroke="#b07070" stroke-width="1.5"/>
      <circle cx="60" cy="310" r="5" fill="#b07070" opacity="0.4"/>
      <circle cx="160" cy="330" r="19" fill="none" stroke="#b07070" stroke-width="1.5"/>
      <circle cx="160" cy="330" r="5" fill="#b07070" opacity="0.4"/>
      <!-- vessel -->
      <path d="M55 90 Q70 160 55 240 Q40 310 60 390" stroke="#c55" stroke-width="3" fill="none" opacity="0.5"/>
    </g>

    <!-- Tumor -->
    <ellipse cx="155" cy="280" rx="55" ry="45" fill="#b85c5c" opacity="0.65" stroke="#8b4040" stroke-width="1.5"/>
    <text x="155" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" opacity="0.9">Tumor</text>
    <text x="155" y="298" text-anchor="middle" font-size="13" fill="#fff" opacity="0.7">mass</text>

    <!-- Label -->
    <text x="140" y="438" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Tissue Sample</text>
    <text x="140" y="460" text-anchor="middle" font-size="14" fill="#64748b">25 classes, 8 organs</text>
  </g>

  <!-- ===== PROBE ===== -->
  <g>
    <!-- Handle -->
    <rect x="120" y="12" width="40" height="80" rx="6" fill="url(#probe-body)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Tip -->
    <path d="M120 90 L132 118 L148 118 L160 90" fill="#94a3b8" stroke="#64748b" stroke-width="1.2"/>
    <!-- Cap -->
    <rect x="115" y="4" width="50" height="14" rx="4" fill="#64748b"/>

    <!-- Glow from tip -->
    <ellipse cx="140" cy="155" rx="50" ry="40" fill="url(#glow)"/>

    <!-- Three wavelength beams -->
    <line x1="133" y1="118" x2="133" y2="180" stroke="#ef4444" stroke-width="3.5" opacity="0.8" stroke-dasharray="5 4"/>
    <line x1="140" y1="118" x2="140" y2="195" stroke="#8b5cf6" stroke-width="3.5" opacity="0.7" stroke-dasharray="5 4"/>
    <line x1="147" y1="118" x2="147" y2="210" stroke="#6366f1" stroke-width="3.5" opacity="0.6" stroke-dasharray="5 4"/>

    <!-- Wavelength labels -->
    <g transform="translate(180, 135)">
      <rect x="-6" y="-12" width="90" height="28" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <circle cx="4" cy="2" r="5" fill="#ef4444"/>
      <text x="16" y="7" font-size="14" font-weight="700" fill="#ef4444">660 nm</text>
    </g>
    <g transform="translate(180, 172)">
      <rect x="-6" y="-12" width="90" height="28" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
      <circle cx="4" cy="2" r="5" fill="#8b5cf6"/>
      <text x="16" y="7" font-size="14" font-weight="700" fill="#8b5cf6">810 nm</text>
    </g>
    <g transform="translate(180, 209)">
      <rect x="-6" y="-12" width="90" height="28" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
      <circle cx="4" cy="2" r="5" fill="#6366f1"/>
      <text x="16" y="7" font-size="14" font-weight="700" fill="#6366f1">940 nm</text>
    </g>
  </g>

  <!-- ===== ARROW: probe area to features ===== -->
  <line x1="270" y1="240" x2="340" y2="240" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- ===== FEATURES (middle-left) ===== -->
  <g>
    <rect x="350" y="70" width="200" height="340" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" filter="url(#sh)"/>
    <!-- Header -->
    <rect x="350" y="70" width="200" height="55" rx="18" fill="#f1f5f9"/>
    <rect x="350" y="100" width="200" height="25" fill="#f1f5f9"/>
    <text x="450" y="105" text-anchor="middle" font-size="17" font-weight="800" fill="#1e293b" letter-spacing="1">FEATURES</text>

    <!-- Reflectances -->
    <circle cx="410" cy="170" r="22" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="410" y="167" text-anchor="middle" font-size="16" font-weight="800" fill="#ef4444">R</text>
    <text x="410" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#ef4444">660</text>

    <circle cx="490" cy="170" r="22" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="490" y="167" text-anchor="middle" font-size="16" font-weight="800" fill="#8b5cf6">R</text>
    <text x="490" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#8b5cf6">810</text>

    <circle cx="450" cy="230" r="22" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
    <text x="450" y="227" text-anchor="middle" font-size="16" font-weight="800" fill="#6366f1">R</text>
    <text x="450" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#6366f1">940</text>

    <!-- Divider -->
    <line x1="370" y1="270" x2="530" y2="270" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Ratios -->
    <circle cx="410" cy="310" r="22" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
    <text x="410" y="305" text-anchor="middle" font-size="11" font-weight="800" fill="#a16207">660</text>
    <line x1="397" y1="312" x2="423" y2="312" stroke="#a16207" stroke-width="1.5"/>
    <text x="410" y="324" text-anchor="middle" font-size="11" font-weight="800" fill="#a16207">810</text>

    <circle cx="490" cy="310" r="22" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
    <text x="490" y="305" text-anchor="middle" font-size="11" font-weight="800" fill="#a16207">810</text>
    <line x1="477" y1="312" x2="503" y2="312" stroke="#a16207" stroke-width="1.5"/>
    <text x="490" y="324" text-anchor="middle" font-size="11" font-weight="800" fill="#a16207">940</text>

    <circle cx="450" cy="365" r="22" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
    <text x="450" y="360" text-anchor="middle" font-size="11" font-weight="800" fill="#a16207">660</text>
    <line x1="437" y1="367" x2="463" y2="367" stroke="#a16207" stroke-width="1.5"/>
    <text x="450" y="379" text-anchor="middle" font-size="11" font-weight="800" fill="#a16207">940</text>

    <!-- Label -->
    <text x="450" y="430" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">6D Vector</text>
    <text x="450" y="450" text-anchor="middle" font-size="13" fill="#64748b">3 raw + 3 ratios</text>
  </g>

  <!-- ===== ARROW: features to model ===== -->
  <line x1="560" y1="240" x2="608" y2="240" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr-b)"/>

  <!-- ===== MLP MODEL (center) ===== -->
  <g>
    <rect x="618" y="70" width="220" height="400" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" filter="url(#sh)"/>
    <!-- Header -->
    <rect x="618" y="70" width="220" height="55" rx="18" fill="url(#mg)"/>
    <rect x="618" y="100" width="220" height="25" fill="url(#mg)"/>
    <text x="728" y="105" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" letter-spacing="1">MLP CLASSIFIER</text>

    <!-- Input -->
    <rect x="645" y="142" width="166" height="48" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="728" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">Input (6)</text>
    <text x="728" y="182" text-anchor="middle" font-size="12" fill="#3b82f6">StandardScaler</text>

    <!-- Arrow -->
    <line x1="728" y1="190" x2="728" y2="210" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>

    <!-- Hidden 1 -->
    <rect x="645" y="218" width="166" height="44" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="728" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">Dense(128) ReLU</text>

    <!-- Arrow -->
    <line x1="728" y1="262" x2="728" y2="280" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>

    <!-- Hidden 2 -->
    <rect x="645" y="288" width="166" height="44" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="728" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">Dense(128) ReLU</text>

    <!-- Arrow -->
    <line x1="728" y1="332" x2="728" y2="350" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>

    <!-- Output -->
    <rect x="645" y="358" width="166" height="48" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
    <text x="728" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Softmax (25)</text>
    <text x="728" y="398" text-anchor="middle" font-size="12" fill="#15803d">tissue classes</text>

    <!-- Stats -->
    <text x="728" y="438" text-anchor="middle" font-size="13" fill="#94a3b8">50K samples &#x00B7; 46 epochs</text>
    <text x="728" y="456" text-anchor="middle" font-size="13" fill="#94a3b8">Adam &#x00B7; early stopping</text>
  </g>

  <!-- ===== ARROW: model to output ===== -->
  <line x1="848" y1="240" x2="896" y2="240" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr-b)"/>

  <!-- ===== OUTPUT (right) ===== -->
  <g>
    <rect x="906" y="70" width="270" height="400" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" filter="url(#sh)"/>
    <!-- Header -->
    <rect x="906" y="70" width="270" height="55" rx="18" fill="url(#og)"/>
    <rect x="906" y="100" width="270" height="25" fill="url(#og)"/>
    <text x="1041" y="105" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" letter-spacing="1">CLASSIFICATION</text>

    <!-- Predicted tissue -->
    <text x="1041" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b" letter-spacing="1.5">PREDICTED TISSUE</text>
    <rect x="930" y="162" width="222" height="52" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="1041" y="185" text-anchor="middle" font-size="18" font-weight="800" fill="#dc2626">Glioma (HG)</text>
    <text x="1041" y="205" text-anchor="middle" font-size="13" fill="#991b1b">tumor &#x00B7; brain</text>

    <!-- Confidence -->
    <text x="1041" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b" letter-spacing="1.5">CONFIDENCE</text>
    <!-- Bar bg -->
    <rect x="930" y="252" width="222" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Bar fill -->
    <rect x="930" y="252" width="178" height="26" rx="13" fill="#059669"/>
    <!-- Threshold marker -->
    <line x1="1074" y1="248" x2="1074" y2="282" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 3"/>
    <!-- Value -->
    <text x="1020" y="270" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">0.80</text>
    <text x="1074" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">threshold 0.65</text>

    <!-- Gate badge -->
    <rect x="960" y="310" width="162" height="42" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
    <text x="1041" y="338" text-anchor="middle" font-size="19" font-weight="800" fill="#059669">DIAGNOSIS</text>

    <!-- Top predictions -->
    <rect x="930" y="370" width="178" height="22" rx="5" fill="#ef4444"/>
    <text x="940" y="386" font-size="13" font-weight="700" fill="#fff">glioma (HG)</text>
    <text x="1132" y="386" text-anchor="end" font-size="13" font-weight="700" fill="#991b1b">80%</text>

    <rect x="930" y="398" width="22" height="22" rx="5" fill="#eab308"/>
    <text x="960" y="414" font-size="13" font-weight="600" fill="#78350f">lung ca.</text>
    <text x="1132" y="414" text-anchor="end" font-size="13" font-weight="600" fill="#92400e">8%</text>

    <rect x="930" y="426" width="14" height="22" rx="5" fill="#3b82f6"/>
    <text x="952" y="442" font-size="13" font-weight="600" fill="#1e3a8a">brain GM</text>
    <text x="1132" y="442" text-anchor="end" font-size="13" font-weight="600" fill="#1e40af">5%</text>

    <!-- Accuracy annotation -->
    <text x="1041" y="486" text-anchor="middle" font-size="15" font-weight="700" fill="#059669">83.6% confident accuracy</text>
  </g>

  <!-- ===== BOTTOM PIPELINE ===== -->
  <g transform="translate(0, 492)">
    <rect x="30" y="0" width="220" height="26" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="140" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">Beer-Lambert + Diffusion</text>

    <line x1="258" y1="13" x2="340" y2="13" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="350" y="0" width="200" height="26" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.2"/>
    <text x="450" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#a16207">Feature Engineering</text>

    <line x1="558" y1="13" x2="608" y2="13" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="618" y="0" width="220" height="26" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="728" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Neural Classification</text>

    <line x1="846" y1="13" x2="896" y2="13" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="906" y="0" width="270" height="26" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <text x="1041" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">Confidence Gating</text>
  </g>
</svg>
